<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">VeriTrace architecture</title>
  <desc id="desc">The local execution loop and the parallel evidence consumers used by VeriTrace.</desc>
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46C2CB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56D364"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <style>
      .label { font: 600 14px "Cascadia Mono", Consolas, Menlo, monospace; letter-spacing: 1.8px; fill: #8B98A5; }
      .node { fill: #111820; stroke: #2A3745; stroke-width: 1.5; rx: 9; }
      .node-cyan { fill: #111820; stroke: #46C2CB; stroke-width: 1.8; rx: 9; }
      .node-green { fill: #111820; stroke: #56D364; stroke-width: 1.8; rx: 9; }
      .primary { font: 600 18px "Cascadia Mono", Consolas, Menlo, monospace; fill: #E6EDF3; text-anchor: middle; }
      .cyan { fill: #46C2CB; }
      .green { fill: #56D364; }
      .secondary { font: 14px "Cascadia Mono", Consolas, Menlo, monospace; fill: #8B98A5; text-anchor: middle; }
      .caption { font: 14px "Cascadia Mono", Consolas, Menlo, monospace; fill: #8B98A5; }
      .line-cyan { fill: none; stroke: #46C2CB; stroke-width: 2; marker-end: url(#arrow-cyan); }
      .line-green { fill: none; stroke: #56D364; stroke-width: 2; marker-end: url(#arrow-green); }
      .line-muted { fill: none; stroke: #718096; stroke-width: 1.6; marker-end: url(#arrow-muted); }
      .line-weak { fill: none; stroke: #4C5968; stroke-width: 1.3; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1200" height="440" rx="16" fill="#0D1117"/>
  <rect x="18" y="18" width="1164" height="404" rx="13" fill="none" stroke="#202A35" stroke-width="1.5"/>

  <text x="42" y="48" class="label">EXECUTION LOOP</text>
  <text x="42" y="89" class="caption">User Task</text>
  <path d="M 110 84 H 151" class="line-muted"/>

  <rect x="152" y="61" width="185" height="68" class="node"/>
  <text x="244" y="88" class="primary">AgentLoop</text>
  <text x="244" y="111" class="secondary">ModelAdapter</text>

  <path d="M 337 95 H 385" class="line-cyan"/>
  <text x="361" y="151" class="caption" text-anchor="middle">model proposes</text>
  <rect x="386" y="61" width="130" height="68" class="node-cyan"/>
  <text x="451" y="101" class="primary cyan">ToolCall</text>

  <path d="M 516 95 H 560" class="line-cyan"/>
  <rect x="561" y="55" width="190" height="80" class="node"/>
  <text x="656" y="84" class="secondary">Tool Registry</text>
  <text x="656" y="111" class="primary">SafetyPolicy</text>

  <path d="M 751 95 H 797" class="line-cyan"/>
  <rect x="798" y="61" width="175" height="68" class="node-cyan"/>
  <text x="885" y="88" class="primary cyan">Local Runtime</text>
  <text x="885" y="111" class="secondary">tools / executor</text>

  <path d="M 973 95 H 1018" class="line-green"/>
  <text x="995" y="151" class="caption" text-anchor="middle">runtime executes</text>
  <rect x="1019" y="61" width="142" height="68" class="node-green"/>
  <text x="1090" y="101" class="primary green">ToolResult</text>

  <rect x="420" y="174" width="190" height="58" class="node"/>
  <text x="515" y="198" class="primary">Conversation</text>
  <text x="515" y="218" class="secondary">Context</text>
  <path d="M 1090 129 V 203 H 611" class="line-muted"/>
  <text x="828" y="192" class="caption" text-anchor="middle">observation enters history</text>
  <path d="M 420 203 H 244 V 130" class="line-muted"/>
  <text x="321" y="192" class="caption" text-anchor="middle">next model turn</text>

  <line x1="42" y1="263" x2="1158" y2="263" stroke="#202A35" stroke-width="1.5"/>
  <text x="42" y="292" class="label">EVIDENCE LAYER</text>

  <rect x="420" y="310" width="190" height="64" class="node-green"/>
  <text x="515" y="337" class="primary green">Structured Event</text>
  <text x="515" y="359" class="secondary">append-only fact</text>
  <path d="M 1090 129 V 250 H 515 V 309" class="line-green"/>
  <text x="806" y="242" class="caption" text-anchor="middle">recorded by AgentLoop</text>

  <path d="M 610 342 H 657 V 306 H 692" class="line-muted"/>
  <path d="M 610 342 H 657 V 381 H 692" class="line-muted"/>
  <path d="M 610 342 H 929" class="line-green"/>

  <rect x="693" y="280" width="128" height="52" class="node"/>
  <text x="757" y="313" class="primary">Trace</text>
  <rect x="693" y="355" width="150" height="52" class="node"/>
  <text x="768" y="388" class="primary">Renderer</text>
  <rect x="930" y="313" width="168" height="58" class="node-green"/>
  <text x="1014" y="349" class="primary green">Verification</text>

  <text x="52" y="342" class="caption">Workspace</text>
  <text x="151" y="306" class="caption" text-anchor="middle">read-only inspection</text>
  <path d="M 125 337 H 176" class="line-weak"/>
  <rect x="177" y="312" width="155" height="52" class="node"/>
  <text x="254" y="345" class="primary">GitInspector</text>
  <path d="M 332 338 V 416 H 660 V 381 H 692" class="line-weak"/>

  <text x="1148" y="410" class="caption" text-anchor="end">Model proposes. Runtime executes. Evidence records.</text>
</svg>
